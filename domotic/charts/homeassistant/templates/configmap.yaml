{{- $cfg := .Values.config -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "homeassistant.fullname" . }}-configuration
  labels:
    {{- include "homeassistant.labels" . | nindent 4 }}
data:
  configuration.yaml: |
    default_config:
    frontend:
      themes: !include_dir_merge_named themes
    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.0.0.0/8
    homeassistant:
      name: {{ $cfg.name | default "Home" }}
      external_url: {{ $cfg.external_url | default "http://example.com" }}
      internal_url: {{ $cfg.internal_url | default "http://homeassistant.local" }}

    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml
  automations.yaml: |
    []
  scripts.yaml: |
    {}
  scenes.yaml: |
    []
  .storage-core.config_entries: |
    {
      "version": 1,
      "minor_version": 5,
      "key": "core.config_entries",
      "data": {
        "entries": [
          {{- if and $cfg.mqtt $cfg.mqtt.server $cfg.mqtt.port -}}
          {
            "created_at":"2025-11-06T09:14:44.904448+00:00",
            "data": {
              "broker":"{{ $cfg.mqtt.server }}",
              "port":{{ $cfg.mqtt.port }}
            },
            "disabled_by":null,
            "discovery_keys":{},
            "domain":"mqtt",
            "entry_id":"01K9C74TS8PAJK8YYPA98PWT24",
            "minor_version":2,
            "modified_at":"2025-11-06T09:14:44.904451+00:00",
            "options":{},
            "pref_disable_new_entities":false,
            "pref_disable_polling":false,
            "source":"user",
            "subentries":[],
            "title":"{{ $cfg.mqtt.server }}",
            "unique_id":null,
            "version":1
          }
          {{- end -}}
        ]
      }
    }
