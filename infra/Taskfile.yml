version: '3'

vars:
  INFRA_REQUESTED_CONFIG_DIR: '{{.DOMOTIC_CONFIG_DIR | default (printf "%s/.." .ROOT_DIR)}}'
  INFRA_CONFIG_DIR: '{{if isAbs (toString .INFRA_REQUESTED_CONFIG_DIR)}}{{.INFRA_REQUESTED_CONFIG_DIR}}{{else}}{{joinPath .USER_WORKING_DIR (toString .INFRA_REQUESTED_CONFIG_DIR)}}{{end}}'
  INFRA_TF_VARS_FILE: '{{.TF_VARS_FILE | default (printf "%s/infra/terraform.tfvars" .INFRA_CONFIG_DIR)}}'
  INFRA_HELM_VALUES_FILE: '{{.HELM_VALUES_FILE | default (printf "%s/infra/helm-values.yaml" .INFRA_CONFIG_DIR)}}'
  INFRA_VALUES_FILE: '{{.VALUES_FILE | default (printf "%s/values.yaml" .INFRA_CONFIG_DIR)}}'
  INFRA_HOMEASSISTANT_BOOTSTRAP_MODE_OVERRIDE: '{{.HOMEASSISTANT_BOOTSTRAP_MODE_OVERRIDE | default ""}}'
  INFRA_CHECK_TF_DATA_DIR: '{{.CHECK_TF_DATA_DIR | default ".tofu-check"}}'

env:
  CONFIG_DIR: '{{.INFRA_CONFIG_DIR}}'
  TF_VARS_FILE: '{{.INFRA_TF_VARS_FILE}}'
  HELM_VALUES_FILE: '{{.INFRA_HELM_VALUES_FILE}}'
  VALUES_FILE: '{{.INFRA_VALUES_FILE}}'

tasks:
  default:
    desc: List infrastructure tasks
    cmds:
      - task --list

  preflight:
    desc: Check OpenTofu, kubectl, cluster access, and R2 state settings
    preconditions:
      - sh: command -v tofu >/dev/null
        msg: Install OpenTofu before running infrastructure tasks.
      - sh: command -v kubectl >/dev/null
        msg: Install kubectl before running infrastructure tasks.
      - sh: test -f "{{.INFRA_TF_VARS_FILE}}"
        msg: Configure the requested OpenTofu variables file first.
      - sh: test -n "${TF_VAR_state_passphrase:-}"
        msg: The OpenTofu state passphrase was not provided.
      - sh: test -n "${CLOUDFLARE_API_TOKEN:-}"
        msg: The Cloudflare API token was not provided by bootstrap state.
      - sh: test -n "${DOMOTIC_R2_ENDPOINT:-}"
        msg: The R2 endpoint was not provided by bootstrap state.
      - sh: test -n "${DOMOTIC_STATE_BUCKET:-}"
        msg: The R2 state bucket was not provided by bootstrap state.
      - sh: test -n "${DOMOTIC_STATE_KEY:-}"
        msg: The R2 state object key was not provided by bootstrap state.
      - sh: test -n "${AWS_ACCESS_KEY_ID:-}" && test -n "${AWS_SECRET_ACCESS_KEY:-}"
        msg: The bucket-scoped R2 state credential was not provided.
    cmds:
      - kubectl get namespace >/dev/null

  init:
    desc: Initialize the encrypted OpenTofu backend in Cloudflare R2
    deps: [preflight]
    cmds:
      - >-
        tofu init -input=false -reconfigure
        -backend-config="bucket=${DOMOTIC_STATE_BUCKET}"
        -backend-config="key=${DOMOTIC_STATE_KEY}"
        -backend-config="region=auto"
        -backend-config="endpoints={s3=\"${DOMOTIC_R2_ENDPOINT}\"}"
        -backend-config="skip_credentials_validation=true"
        -backend-config="skip_metadata_api_check=true"
        -backend-config="skip_region_validation=true"
        -backend-config="skip_requesting_account_id=true"
        -backend-config="skip_s3_checksum=true"
        -backend-config="use_path_style=true"
        -backend-config="use_lockfile=true"

  plan:
    desc: Preview infrastructure changes
    cmds:
      - task: init
      - |
        bootstrap_mode='{{.INFRA_HOMEASSISTANT_BOOTSTRAP_MODE_OVERRIDE}}'
        case "$bootstrap_mode" in
          "") bootstrap_mode_arg= ;;
          seed|restore) bootstrap_mode_arg="-var=homeassistant_bootstrap_mode=$bootstrap_mode" ;;
          *) echo "Invalid Home Assistant bootstrap mode: $bootstrap_mode" >&2; exit 1 ;;
        esac
        tofu plan -input=false -var-file="{{.INFRA_TF_VARS_FILE}}" $bootstrap_mode_arg

  apply:
    desc: Apply infrastructure changes and refresh Helm values
    cmds:
      - task: init
      - |
        bootstrap_mode='{{.INFRA_HOMEASSISTANT_BOOTSTRAP_MODE_OVERRIDE}}'
        case "$bootstrap_mode" in
          "") bootstrap_mode_arg= ;;
          seed|restore) bootstrap_mode_arg="-var=homeassistant_bootstrap_mode=$bootstrap_mode" ;;
          *) echo "Invalid Home Assistant bootstrap mode: $bootstrap_mode" >&2; exit 1 ;;
        esac
        tofu apply -input=false -var-file="{{.INFRA_TF_VARS_FILE}}" $bootstrap_mode_arg
      - task: helm-values

  destroy:
    desc: Destroy cluster and ordinary Cloudflare infrastructure
    cmds:
      - task: init
      - tofu destroy -input=false -var-file="{{.INFRA_TF_VARS_FILE}}"

  helm-values:
    desc: Write OpenTofu outputs consumed by the Helm chart
    cmds:
      - |
        values_dir="$(dirname "{{.INFRA_HELM_VALUES_FILE}}")"
        install -d -m 0700 "$values_dir"
        values_temp="$(mktemp "$values_dir/.helm-values.XXXXXX")"
        trap 'rm -f -- "$values_temp"' EXIT
        tofu output -raw helm_values_yaml > "$values_temp"
        chmod 0600 "$values_temp"
        mv -f "$values_temp" "{{.INFRA_HELM_VALUES_FILE}}"
        trap - EXIT

  outputs:
    desc: Show non-sensitive OpenTofu outputs
    cmds:
      - tofu output {{.CLI_ARGS}}

  format:
    desc: Format OpenTofu files
    cmds:
      - tofu fmt -recursive

  format-check:
    desc: Check OpenTofu formatting
    cmds:
      - tofu fmt -check -recursive

  validate:
    desc: Validate OpenTofu configuration without accessing remote state
    cmds:
      - >-
        TF_VAR_state_passphrase=domotic-static-check-passphrase
        TF_DATA_DIR="{{.INFRA_CHECK_TF_DATA_DIR}}"
        tofu init -backend=false -input=false
      - >-
        TF_VAR_state_passphrase=domotic-static-check-passphrase
        TF_DATA_DIR="{{.INFRA_CHECK_TF_DATA_DIR}}"
        tofu validate

  test:
    desc: Run OpenTofu tests with mocked external providers
    cmds:
      - >-
        TF_VAR_state_passphrase=domotic-static-check-passphrase
        TF_DATA_DIR="{{.INFRA_CHECK_TF_DATA_DIR}}"
        tofu init -backend=false -input=false
      - >-
        TF_VAR_state_passphrase=domotic-static-check-passphrase
        TF_DATA_DIR="{{.INFRA_CHECK_TF_DATA_DIR}}"
        tofu test

  check:
    desc: Check OpenTofu formatting, configuration, and tests
    cmds:
      - task: format-check
      - task: validate
      - task: test
