version: '3'

vars:
  # Upgrade by changing this one reviewed commit SHA, then run task check,
  # task backup, task plan, and task deploy in that order.
  DOMOTIC_REF: REPLACE_WITH_FULL_COMMIT_SHA

includes:
  domotic:
    taskfile: 'https://github.com/fiam/domotic.git//Taskfile.remote.yml?ref={{.DOMOTIC_REF}}'
    flatten: true
    vars:
      DOMOTIC_REF: '{{.DOMOTIC_REF}}'
      PRIVATE_ROOT: '{{.ROOT_DIR}}'
      CONFIG_DIR: '{{.ROOT_DIR}}/config'
      # The scheme selects the resolver. See README.md for keychain://, op://,
      # env://, and optional sops:// examples.
      CLOUDFLARE_API_TOKEN_REF: 'keychain://domotic/cloudflare-api-token'
      HOMEASSISTANT_ADMIN_PASSWORD_REF: 'keychain://domotic/homeassistant-admin-password'
      # SOPS_AGE_KEY_REF: 'keychain://domotic/sops-age-key'
      # SECRET_RESOLVER: '{{.ROOT_DIR}}/scripts/custom-secret-resolver'
      WITH_HOMEASSISTANT_ADMIN: 'true'
      KUBE_CONTEXT: domotic
      STATE_NAMESPACE: terraform-state
      RELEASE_NAME: domotic
      NAMESPACE: domotic
