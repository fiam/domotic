version: '3'

vars:
  # Upgrade by changing this one reviewed commit SHA, then run task check,
  # task plan, and task deploy in that order.
  DOMOTIC_REF: REPLACE_WITH_FULL_COMMIT_SHA

includes:
  domotic:
    taskfile: 'https://github.com/fiam/domotic.git//Taskfile.remote.yml?ref={{.DOMOTIC_REF}}'
    flatten: true
    vars:
      PRIVATE_ROOT: '{{.ROOT_DIR}}'
      CONFIG_DIR: '{{.ROOT_DIR}}/config'
      BOOTSTRAP_VARS_FILE: '{{.ROOT_DIR}}/config/bootstrap.tfvars'
      BOOTSTRAP_STATE_FILE: '{{.ROOT_DIR}}/state/bootstrap.tfstate'
      RELEASE_NAME: domotic
      NAMESPACE: domotic
