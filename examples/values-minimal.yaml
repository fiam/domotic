# ==============================================================================
# Minimal Domotic Configuration Example
# ==============================================================================
# This is the bare minimum configuration to get started
# Assumes: OpenTofu has already created secrets

# Zigbee2MQTT Configuration
zigbee2mqtt:
  # References to OpenTofu-created resources
  secretRef:
    name: zigbee-keys           # Sensitive keys (from OpenTofu)
  configMapRef:
    name: zigbee-network        # Network config (from OpenTofu)

  config:
    serial:
      port: /dev/ttyUSB0         # Change to your device
      adapter: ember              # Change to your adapter type (ember, deconz, zigate, etc.)

    mqtt:
      server: domotic-mosquitto   # Service name from Helm release
      port: 1883

  # Note: Zigbee network settings (pan_id, channel, network_key, ext_pan_id)
  # are managed by OpenTofu and loaded from the Secret/ConfigMap above

# Home Assistant Configuration
homeassistant:
  config:
    # Reconciled through the Home Assistant API on each seed-mode deployment.
    # UI edits remain possible but are reset to these values on the next deploy.
    name: "Home"
    external_url: "https://homeassistant.example.com"  # Managed by Cloudflare Tunnel
    internal_url: "http://homeassistant.local"

    mqtt:
      server: domotic-mosquitto
      port: 1883

# Cloudflared Tunnel
cloudflared:
  tunnelTokenSecret:
    name: cloudflared-tunnel-token  # Created by OpenTofu
    key: token

# Mosquitto MQTT Broker
mosquitto:
  persistence:
    enabled: true
    size: 1Gi
