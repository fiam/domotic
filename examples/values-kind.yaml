# Example Helm values for kind (local Kubernetes development)
# This configuration works with the Kind cluster created by `task dev:create`.
# It uses the zstackmulator emulator for Zigbee development without physical hardware

homeassistant:
  customComponents:
    local:
      - name: custom integration
        source: files/repositories/custom-integration/custom_components/custom integration
  httpRoute:
    parentRefs:
    - name: gateway
      namespace: default

zigbee2mqtt:
  httpRoute:
    parentRefs:
    - name: gateway
      namespace: default
  config:
    serial:
      port: tcp://zstackmulator.zstackmulator.svc.cluster.local:6638
      adapter: zstack
