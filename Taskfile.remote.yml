version: '3'

# This Taskfile is intentionally self-contained. It reads the requested Git
# revision from its own remote URL, then creates a detached, commit-pinned
# source tree before delegating to the main Taskfile.

vars:
  PRIVATE_ROOT: '{{.PRIVATE_ROOT | default .USER_WORKING_DIR}}'
  CONFIG_DIR: '{{.CONFIG_DIR | default (printf "%s/config" .PRIVATE_ROOT)}}'
  DOMOTIC_SOURCE_DIR: '{{.DOMOTIC_SOURCE_DIR | default (printf "%s/.domotic/source" .PRIVATE_ROOT)}}'
  DOMOTIC_REPOSITORY: '{{.DOMOTIC_REPOSITORY | default "https://github.com/fiam/domotic.git"}}'
  DOMOTIC_REQUESTED_REF:
    sh: |
      requested_ref="$({
        printf '%s\n' '{{.TASKFILE}}' |
          awk -F '[?&]' '{
            for (field = 1; field <= NF; field++) {
              if ($field ~ /^ref=/) {
                print substr($field, 5)
                exit
              }
            }
          }'
      })"
      printf '%s\n' "${requested_ref:-main}"
  KUBE_CONFIG_PATH: '{{.KUBE_CONFIG_PATH | default (printf "%s/.kube/config" .HOME)}}'
  KUBE_CONTEXT: '{{.KUBE_CONTEXT | default "domotic"}}'
  STATE_NAMESPACE: '{{.STATE_NAMESPACE | default "terraform-state"}}'
  RELEASE_NAME: '{{.RELEASE_NAME | default "domotic"}}'
  NAMESPACE: '{{.NAMESPACE | default "domotic"}}'
  SSH_USER: '{{.SSH_USER | default ""}}'
  SSH_HOST: '{{.SSH_HOST | default ""}}'
  SECRETS_FILE: '{{.SECRETS_FILE | default (printf "%s/secrets.sops.yaml" .CONFIG_DIR)}}'

env:
  DOMOTIC_SSH_USER: '{{.SSH_USER}}'
  DOMOTIC_SSH_HOST: '{{.SSH_HOST}}'

tasks:
  default:
    desc: List private deployment tasks
    cmds:
      - task --list

  bootstrap:
    desc: Materialize the requested Domotic revision in the ignored local cache
    cmds:
      - |
        requested_ref='{{.DOMOTIC_REQUESTED_REF}}'
        repository='{{.DOMOTIC_REPOSITORY}}'
        source_dir='{{.DOMOTIC_SOURCE_DIR}}'

        test -n "$requested_ref" || {
          echo 'The Taskfile URL has an empty ref parameter.' >&2
          exit 1
        }
        test ! -L "$source_dir" || {
          echo "Refusing a symlinked source cache: $source_dir" >&2
          exit 1
        }
        if test ! -d "$source_dir/.git"; then
          test ! -e "$source_dir" || {
            echo "Source cache exists but is not a Git repository: $source_dir" >&2
            exit 1
          }
          install -d -m 0700 "$(dirname "$source_dir")"
          git clone --quiet --filter=blob:none --no-checkout "$repository" "$source_dir"
        fi
        test ! -L "$source_dir/.git" || {
          echo "Refusing a source cache with a symlinked .git entry: $source_dir" >&2
          exit 1
        }
        test "$(git -C "$source_dir" remote get-url origin)" = "$repository" || {
          echo 'The cached source has an unexpected origin URL.' >&2
          exit 1
        }

        if printf '%s\n' "$requested_ref" | grep -Eq '^[0-9a-fA-F]{40}$'; then
          resolved_ref="$requested_ref"
          if ! git -C "$source_dir" cat-file -e "$resolved_ref^{commit}" 2>/dev/null; then
            git -C "$source_dir" fetch --quiet --force --depth 1 origin "$requested_ref"
          fi
        else
          git check-ref-format --allow-onelevel "$requested_ref" >/dev/null 2>&1 || {
            echo "Invalid Git ref in the Taskfile URL: $requested_ref" >&2
            exit 1
          }
          git -C "$source_dir" fetch --quiet --force --depth 1 origin "$requested_ref"
          resolved_ref="$(git -C "$source_dir" rev-parse 'FETCH_HEAD^{commit}')"
        fi
        git -C "$source_dir" cat-file -e "$resolved_ref^{commit}"
        git -C "$source_dir" checkout --quiet --detach --force "$resolved_ref"
        git -C "$source_dir" reset --quiet --hard "$resolved_ref"
        git -C "$source_dir" clean -ffd
        test "$(git -C "$source_dir" rev-parse HEAD)" = \
          "$(git -C "$source_dir" rev-parse "$resolved_ref^{commit}")"

  init:
    desc: Initialize a private deployment repository in the working directory
    deps: [bootstrap]
    cmds:
      - |
        private_root='{{.PRIVATE_ROOT}}'
        source_dir='{{.DOMOTIC_SOURCE_DIR}}'
        ref="$(git -C "$source_dir" rev-parse HEAD)"

        test ! -e "$private_root/Taskfile.yml" || {
          echo "Refusing to replace an existing Taskfile.yml in $private_root" >&2
          exit 1
        }
        test ! -e "$private_root/config" || {
          echo "Refusing to replace an existing config directory in $private_root" >&2
          exit 1
        }
        cp -R "$source_dir/examples/private-deployment/." "$private_root/"
        sed -i.bak "s/REPLACE_WITH_FULL_COMMIT_SHA/$ref/g" "$private_root/Taskfile.yml"
        rm "$private_root/Taskfile.yml.bak"
        private_root_physical="$(cd "$private_root" && pwd -P)"
        existing_git_root="$(git -C "$private_root" rev-parse --show-toplevel 2>/dev/null || true)"
        if test "$existing_git_root" != "$private_root_physical"; then
          git -C "$private_root" init -b main
        fi
        printf 'Private deployment scaffold created in %s.\n' "$private_root"
        printf 'Edit config/, encrypt the SOPS credentials, then run task check and task plan.\n'

  config:check:
    desc: Validate private configuration and Git secret boundaries
    deps: [bootstrap]
    cmds:
      - >-
        task --dir "{{.DOMOTIC_SOURCE_DIR}}" config:check
        CONFIG_DIR="{{.CONFIG_DIR}}"
        SECRETS_FILE="{{.SECRETS_FILE}}"

  domotic:update:
    desc: Update the pinned Domotic revision without deploying it
    deps: [bootstrap]
    cmds:
      - |
        target_ref='{{.REF | default "main"}}'
        source_dir='{{.DOMOTIC_SOURCE_DIR}}'
        private_taskfile='{{.PRIVATE_ROOT}}/Taskfile.yml'

        test -n "$target_ref" || {
          echo 'REF cannot be empty.' >&2
          exit 1
        }
        test -f "$private_taskfile" && test ! -L "$private_taskfile" || {
          echo "Expected a regular private Taskfile: $private_taskfile" >&2
          exit 1
        }
        test "$(grep -Ec '^  DOMOTIC_REF:' "$private_taskfile")" -eq 1 || {
          echo "Expected exactly one DOMOTIC_REF in $private_taskfile" >&2
          exit 1
        }

        if printf '%s\n' "$target_ref" | grep -Eq '^[0-9a-fA-F]{40}$'; then
          resolved_ref="$target_ref"
          if ! git -C "$source_dir" cat-file -e "$resolved_ref^{commit}" 2>/dev/null; then
            git -C "$source_dir" fetch --quiet --force --depth 1 origin "$target_ref"
          fi
        else
          git check-ref-format --allow-onelevel "$target_ref" >/dev/null 2>&1 || {
            echo "Invalid Git ref: $target_ref" >&2
            exit 1
          }
          git -C "$source_dir" fetch --quiet --force --depth 1 origin "$target_ref"
          resolved_ref="$(git -C "$source_dir" rev-parse 'FETCH_HEAD^{commit}')"
        fi
        resolved_ref="$(git -C "$source_dir" rev-parse "$resolved_ref^{commit}")"

        sed -i.bak -E \
          "s/^  DOMOTIC_REF:.*/  DOMOTIC_REF: $resolved_ref/" \
          "$private_taskfile"
        rm "$private_taskfile.bak"
        grep -Fqx "  DOMOTIC_REF: $resolved_ref" "$private_taskfile"

        git -C "$source_dir" checkout --quiet --detach --force "$resolved_ref"
        git -C "$source_dir" reset --quiet --hard "$resolved_ref"
        git -C "$source_dir" clean -ffd

        printf 'Domotic is now pinned to %s (%s).\n' "$resolved_ref" "$target_ref"
        printf 'Review and commit the Taskfile.yml change before deploying.\n'

  k3s:context:
    desc: Import the k3s server into the default kubeconfig
    deps: [bootstrap]
    requires:
      vars: [SSH_USER, SSH_HOST]
    cmds:
      - >-
        "{{.DOMOTIC_SOURCE_DIR}}/scripts/k3s-import-context.sh"
        --user "$DOMOTIC_SSH_USER"
        --context "{{.KUBE_CONTEXT}}"
        "$DOMOTIC_SSH_HOST"

  check:
    desc: Validate the pinned source and private configuration
    deps: [bootstrap]
    cmds:
      - task --dir "{{.DOMOTIC_SOURCE_DIR}}" check
      - task: config:check

  secrets:check:
    desc: Confirm that SOPS can decrypt the deployment secrets
    deps: [bootstrap]
    cmds:
      - >-
        "{{.DOMOTIC_SOURCE_DIR}}/scripts/with-deployment-secrets.sh"
        check "{{.SECRETS_FILE}}"

  secrets:edit:
    desc: Edit the encrypted deployment secrets with SOPS
    deps: [bootstrap]
    preconditions:
      - sh: command -v sops >/dev/null 2>&1
        msg: sops is required to edit deployment secrets.
      - sh: test -f "{{.SECRETS_FILE}}"
        msg: Create and encrypt config/secrets.sops.yaml first.
    cmds:
      - sops "{{.SECRETS_FILE}}"

  plan:
    desc: Plan the private deployment with SOPS credentials
    deps: [config:check]
    cmds:
      - >-
        "{{.DOMOTIC_SOURCE_DIR}}/scripts/with-deployment-secrets.sh"
        seed "{{.SECRETS_FILE}}" --
        task --dir "{{.DOMOTIC_SOURCE_DIR}}" infra:plan
        CONFIG_DIR="{{.CONFIG_DIR}}"
        KUBE_CONFIG_PATH="{{.KUBE_CONFIG_PATH}}"
        KUBE_CONTEXT="{{.KUBE_CONTEXT}}"
        STATE_NAMESPACE="{{.STATE_NAMESPACE}}"

  deploy:
    desc: Apply Terraform and deploy the pinned Helm chart
    deps: [config:check]
    cmds:
      - >-
        "{{.DOMOTIC_SOURCE_DIR}}/scripts/with-deployment-secrets.sh"
        seed "{{.SECRETS_FILE}}" --
        task --dir "{{.DOMOTIC_SOURCE_DIR}}" deploy
        CONFIG_DIR="{{.CONFIG_DIR}}"
        KUBE_CONFIG_PATH="{{.KUBE_CONFIG_PATH}}"
        KUBE_CONTEXT="{{.KUBE_CONTEXT}}"
        STATE_NAMESPACE="{{.STATE_NAMESPACE}}"
        RELEASE_NAME="{{.RELEASE_NAME}}"
        NAMESPACE="{{.NAMESPACE}}"

  homeassistant:deploy:
    desc: Deploy the Helm release without applying Terraform
    deps: [config:check]
    cmds:
      - >-
        task --dir "{{.DOMOTIC_SOURCE_DIR}}" helm:deploy
        CONFIG_DIR="{{.CONFIG_DIR}}"
        KUBE_CONFIG_PATH="{{.KUBE_CONFIG_PATH}}"
        KUBE_CONTEXT="{{.KUBE_CONTEXT}}"
        RELEASE_NAME="{{.RELEASE_NAME}}"
        NAMESPACE="{{.NAMESPACE}}"

  homeassistant:update:
    desc: Update Home Assistant to the version verified by the Domotic pin
    deps: [config:check]
    cmds:
      - |
        version="$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' \
          "{{.DOMOTIC_SOURCE_DIR}}/charts/domotic/charts/homeassistant/Chart.yaml")"
        test -n "$version"
        "{{.DOMOTIC_SOURCE_DIR}}/scripts/set-homeassistant-version.sh" \
          "{{.CONFIG_DIR}}/values.yaml" "$version"
        printf 'Home Assistant is pinned to %s in config/values.yaml.\n' "$version"
      - task: homeassistant:deploy

  restore:
    desc: Prepare Home Assistant to import a native backup
    deps: [config:check]
    cmds:
      - >-
        "{{.DOMOTIC_SOURCE_DIR}}/scripts/with-deployment-secrets.sh"
        cloudflare "{{.SECRETS_FILE}}" --
        task --dir "{{.DOMOTIC_SOURCE_DIR}}" restore
        CONFIG_DIR="{{.CONFIG_DIR}}"
        KUBE_CONFIG_PATH="{{.KUBE_CONFIG_PATH}}"
        KUBE_CONTEXT="{{.KUBE_CONTEXT}}"
        STATE_NAMESPACE="{{.STATE_NAMESPACE}}"
        RELEASE_NAME="{{.RELEASE_NAME}}"
        NAMESPACE="{{.NAMESPACE}}"

  restore:plan:
    desc: Plan the native-backup restore preparation
    deps: [config:check]
    cmds:
      - >-
        "{{.DOMOTIC_SOURCE_DIR}}/scripts/with-deployment-secrets.sh"
        cloudflare "{{.SECRETS_FILE}}" --
        task --dir "{{.DOMOTIC_SOURCE_DIR}}" restore:plan
        CONFIG_DIR="{{.CONFIG_DIR}}"
        KUBE_CONFIG_PATH="{{.KUBE_CONFIG_PATH}}"
        KUBE_CONTEXT="{{.KUBE_CONTEXT}}"
        STATE_NAMESPACE="{{.STATE_NAMESPACE}}"

  status:
    desc: Show the deployed release and workload status
    deps: [bootstrap]
    cmds:
      - >-
        task --dir "{{.DOMOTIC_SOURCE_DIR}}" helm:status
        KUBE_CONTEXT="{{.KUBE_CONTEXT}}"
        RELEASE_NAME="{{.RELEASE_NAME}}"
        NAMESPACE="{{.NAMESPACE}}"

  backup:
    desc: Create an encrypted configuration backup in R2
    deps: [config:check]
    cmds:
      - >-
        task --dir "{{.DOMOTIC_SOURCE_DIR}}" backup
        CONFIG_DIR="{{.CONFIG_DIR}}"
        KUBE_CONFIG_PATH="{{.KUBE_CONFIG_PATH}}"
        KUBE_CONTEXT="{{.KUBE_CONTEXT}}"
        STATE_NAMESPACE="{{.STATE_NAMESPACE}}"

  backup:list:
    desc: List encrypted configuration backups in R2
    deps: [bootstrap]
    cmds:
      - >-
        task --dir "{{.DOMOTIC_SOURCE_DIR}}" backup:list
        CONFIG_DIR="{{.CONFIG_DIR}}"

  backup:restore:
    desc: Restore one encrypted configuration backup into config/restore
    deps: [bootstrap]
    requires:
      vars: [OBJECT]
    cmds:
      - >-
        task --dir "{{.DOMOTIC_SOURCE_DIR}}" backup:restore
        CONFIG_DIR="{{.CONFIG_DIR}}"
        OBJECT="{{.OBJECT}}"

  keys:capture:
    desc: Capture the live Zigbee identity into the private runtime files
    deps: [bootstrap]
    cmds:
      - >-
        task --dir "{{.DOMOTIC_SOURCE_DIR}}" keys:capture
        CONFIG_DIR="{{.CONFIG_DIR}}"
        KUBE_CONFIG_PATH="{{.KUBE_CONFIG_PATH}}"
        KUBE_CONTEXT="{{.KUBE_CONTEXT}}"
        STATE_NAMESPACE="{{.STATE_NAMESPACE}}"

  destroy:
    desc: Uninstall the release and destroy Terraform-managed resources
    deps: [config:check]
    prompt: This removes the private deployment. Continue?
    cmds:
      - >-
        "{{.DOMOTIC_SOURCE_DIR}}/scripts/with-deployment-secrets.sh"
        cloudflare "{{.SECRETS_FILE}}" --
        task --dir "{{.DOMOTIC_SOURCE_DIR}}" destroy
        CONFIG_DIR="{{.CONFIG_DIR}}"
        KUBE_CONFIG_PATH="{{.KUBE_CONFIG_PATH}}"
        KUBE_CONTEXT="{{.KUBE_CONTEXT}}"
        STATE_NAMESPACE="{{.STATE_NAMESPACE}}"
        RELEASE_NAME="{{.RELEASE_NAME}}"
        NAMESPACE="{{.NAMESPACE}}"

  version:
    desc: Show the requested and materialized Domotic revisions
    deps: [bootstrap]
    cmds:
      - echo "Requested revision {{.DOMOTIC_REQUESTED_REF}}"
      - git -C "{{.DOMOTIC_SOURCE_DIR}}" log -1 --oneline
