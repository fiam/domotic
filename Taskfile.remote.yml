version: '3'

# This Taskfile is intentionally self-contained. It reads the requested Git
# revision from its own remote URL, materializes that revision, and only then
# delegates to repository scripts and Taskfiles.

vars:
  RESOLVED_PRIVATE_ROOT: '{{.PRIVATE_ROOT | default .USER_WORKING_DIR}}'
  RESOLVED_CONFIG_DIR: '{{.DOMOTIC_CONFIG_DIR | default (printf "%s/config" .RESOLVED_PRIVATE_ROOT)}}'
  RESOLVED_DOMOTIC_SOURCE_DIR: '{{.DOMOTIC_SOURCE_DIR | default (printf "%s/.domotic/source" .RESOLVED_PRIVATE_ROOT)}}'
  RESOLVED_DOMOTIC_REPOSITORY: '{{.DOMOTIC_REPOSITORY | default "https://github.com/fiam/domotic.git"}}'
  DOMOTIC_REQUESTED_REF:
    sh: |
      requested_ref='{{.DOMOTIC_PINNED_REF | default ""}}'
      if test -z "$requested_ref"; then
        requested_ref="$({
          printf '%s\n' '{{.TASKFILE}}' |
            awk -F '[?&]' '{
              for (field = 1; field <= NF; field++) {
                if ($field ~ /^ref=/) {
                  print substr($field, 5)
                  exit
                }
              }
            }'
        })"
      fi
      printf '%s\n' "${requested_ref:-main}"
  RESOLVED_BOOTSTRAP_VARS_FILE: '{{.BOOTSTRAP_VARS_FILE | default (printf "%s/bootstrap.tfvars" .RESOLVED_CONFIG_DIR)}}'
  RESOLVED_BOOTSTRAP_STATE_FILE: '{{.DOMOTIC_BOOTSTRAP_STATE_FILE | default (printf "%s/state/bootstrap.tfstate" .RESOLVED_PRIVATE_ROOT)}}'
  RESOLVED_RELEASE_NAME: '{{.RELEASE_NAME | default "domotic"}}'
  RESOLVED_NAMESPACE: '{{.NAMESPACE | default "domotic"}}'
  RESOLVED_SSH_USER: '{{.SSH_USER | default ""}}'
  RESOLVED_SSH_HOST: '{{.SSH_HOST | default ""}}'

env:
  DOMOTIC_SSH_USER: '{{.RESOLVED_SSH_USER}}'
  DOMOTIC_SSH_HOST: '{{.RESOLVED_SSH_HOST}}'
  BOOTSTRAP_VARS_FILE: '{{.RESOLVED_BOOTSTRAP_VARS_FILE}}'
  BOOTSTRAP_STATE_FILE: '{{.RESOLVED_BOOTSTRAP_STATE_FILE}}'

tasks:
  default:
    desc: List private deployment tasks
    cmds:
      - task --list

  source:sync:
    internal: true
    desc: Materialize the requested Domotic revision in the ignored local cache
    cmds:
      - |
        requested_ref='{{.DOMOTIC_REQUESTED_REF}}'
        repository='{{.RESOLVED_DOMOTIC_REPOSITORY}}'
        source_dir='{{.RESOLVED_DOMOTIC_SOURCE_DIR}}'

        test -n "$requested_ref" || {
          echo 'The Taskfile URL has an empty ref parameter.' >&2
          exit 1
        }
        test ! -L "$source_dir" || {
          echo "Refusing a symlinked source cache: $source_dir" >&2
          exit 1
        }
        if test ! -d "$source_dir/.git"; then
          test ! -e "$source_dir" || {
            echo "Source cache exists but is not a Git repository: $source_dir" >&2
            exit 1
          }
          install -d -m 0700 "$(dirname "$source_dir")"
          git clone --quiet --filter=blob:none --no-checkout "$repository" "$source_dir"
        fi
        test ! -L "$source_dir/.git" || {
          echo "Refusing a source cache with a symlinked .git entry: $source_dir" >&2
          exit 1
        }
        canonical_repository_url() {
          case "$1" in
            git@github.com:*)
              github_path="${1#git@github.com:}"
              ;;
            ssh://git@github.com/*)
              github_path="${1#ssh://git@github.com/}"
              ;;
            https://github.com/*)
              github_path="${1#https://github.com/}"
              ;;
            *)
              printf '%s\n' "$1"
              return
              ;;
          esac
          github_path="${github_path%/}"
          printf 'github.com/%s\n' "${github_path%.git}"
        }

        cached_repository="$(
          git -C "$source_dir" config --local --get remote.origin.url
        )"
        if test "$cached_repository" != "$repository"; then
          test "$(canonical_repository_url "$cached_repository")" = \
            "$(canonical_repository_url "$repository")" || {
            printf 'The cached source has an unexpected origin URL.\n' >&2
            printf 'Expected: %s\n' "$repository" >&2
            printf 'Actual:   %s\n' "$cached_repository" >&2
            exit 1
          }
          git -C "$source_dir" remote set-url origin "$repository"
        fi

        if printf '%s\n' "$requested_ref" | grep -Eq '^[0-9a-fA-F]{40}$'; then
          resolved_ref="$requested_ref"
          if ! git -C "$source_dir" cat-file -e "$resolved_ref^{commit}" 2>/dev/null; then
            git -C "$source_dir" fetch --quiet --force --depth 1 origin "$requested_ref"
          fi
        else
          git check-ref-format --allow-onelevel "$requested_ref" >/dev/null 2>&1 || {
            echo "Invalid Git ref in the Taskfile URL: $requested_ref" >&2
            exit 1
          }
          git -C "$source_dir" fetch --quiet --force --depth 1 origin "$requested_ref"
          resolved_ref="$(git -C "$source_dir" rev-parse 'FETCH_HEAD^{commit}')"
        fi
        git -C "$source_dir" cat-file -e "$resolved_ref^{commit}"
        git -C "$source_dir" checkout --quiet --detach --force "$resolved_ref"
        git -C "$source_dir" reset --quiet --hard "$resolved_ref"
        git -C "$source_dir" clean -ffd
        test "$(git -C "$source_dir" rev-parse HEAD)" = \
          "$(git -C "$source_dir" rev-parse "$resolved_ref^{commit}")"

  init:
    desc: Initialize a private deployment repository in the working directory
    deps: [source:sync]
    cmds:
      - |
        private_root='{{.RESOLVED_PRIVATE_ROOT}}'
        source_dir='{{.RESOLVED_DOMOTIC_SOURCE_DIR}}'
        ref="$(git -C "$source_dir" rev-parse HEAD)"

        test ! -e "$private_root/Taskfile.yml" || {
          echo "Refusing to replace an existing Taskfile.yml in $private_root" >&2
          exit 1
        }
        test ! -e "$private_root/config" || {
          echo "Refusing to replace an existing config directory in $private_root" >&2
          exit 1
        }
        cp -R "$source_dir/examples/private-deployment/." "$private_root/"
        sed -i.bak "s/REPLACE_WITH_FULL_COMMIT_SHA/$ref/g" "$private_root/Taskfile.yml"
        rm "$private_root/Taskfile.yml.bak"
        private_root_physical="$(cd "$private_root" && pwd -P)"
        existing_git_root="$(git -C "$private_root" rev-parse --show-toplevel 2>/dev/null || true)"
        if test "$existing_git_root" != "$private_root_physical"; then
          git -C "$private_root" init -b main
        fi
        printf 'Private deployment scaffold created in %s.\n' "$private_root"
        printf 'Edit config/bootstrap.tfvars and config/, then run task bootstrap.\n'

  bootstrap:
    desc: Create the encrypted R2 state and backup foundation
    deps: [source:sync]
    cmds:
      - >-
        "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}/scripts/with-opentofu-environment.sh"
        bootstrap "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}" "{{.RESOLVED_PRIVATE_ROOT}}" "{{.RESOLVED_CONFIG_DIR}}" --
        env
        BOOTSTRAP_VARS_FILE="{{.RESOLVED_BOOTSTRAP_VARS_FILE}}"
        DOMOTIC_BOOTSTRAP_STATE_FILE="{{.RESOLVED_BOOTSTRAP_STATE_FILE}}"
        task --dir "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}" bootstrap:apply
      - |
        printf 'Bootstrap state updated: %s\n' '{{.RESOLVED_BOOTSTRAP_STATE_FILE}}'
        printf 'Review and commit that encrypted file before deploying.\n'

  cloudflare-token:update:
    desc: Replace the Cloudflare account token retained in encrypted state
    deps: [source:sync]
    cmds:
      - >-
        "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}/scripts/with-opentofu-environment.sh"
        rotate-cloudflare-token "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}" "{{.RESOLVED_PRIVATE_ROOT}}" "{{.RESOLVED_CONFIG_DIR}}" --
        env
        BOOTSTRAP_VARS_FILE="{{.RESOLVED_BOOTSTRAP_VARS_FILE}}"
        DOMOTIC_BOOTSTRAP_STATE_FILE="{{.RESOLVED_BOOTSTRAP_STATE_FILE}}"
        task --dir "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}" bootstrap:apply
      - |
        printf 'Cloudflare token replaced in encrypted bootstrap state.\n'
        printf 'Review and commit %s.\n' '{{.RESOLVED_BOOTSTRAP_STATE_FILE}}'

  recovery-passphrase:update:
    desc: Re-encrypt bootstrap and main state with a new recovery passphrase
    deps: [config:check]
    cmds:
      - >-
        "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}/scripts/with-opentofu-environment.sh"
        runtime "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}" "{{.RESOLVED_PRIVATE_ROOT}}" "{{.RESOLVED_CONFIG_DIR}}" --
        "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}/scripts/rotate-recovery-passphrase.sh"
        "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}" "{{.RESOLVED_PRIVATE_ROOT}}" "{{.RESOLVED_CONFIG_DIR}}"
        "{{.RESOLVED_BOOTSTRAP_STATE_FILE}}"

  config:check:
    desc: Validate private configuration and Git secret boundaries
    deps: [source:sync]
    cmds:
      - >-
        env
        DOMOTIC_CONFIG_DIR="{{.RESOLVED_CONFIG_DIR}}"
        BOOTSTRAP_VARS_FILE="{{.RESOLVED_BOOTSTRAP_VARS_FILE}}"
        DOMOTIC_BOOTSTRAP_STATE_FILE="{{.RESOLVED_BOOTSTRAP_STATE_FILE}}"
        task --dir "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}" config:check

  domotic:update:
    desc: Update the pinned Domotic revision without deploying it
    deps: [source:sync]
    cmds:
      - |
        target_ref='{{.REF | default "main"}}'
        source_dir='{{.RESOLVED_DOMOTIC_SOURCE_DIR}}'
        private_taskfile='{{.RESOLVED_PRIVATE_ROOT}}/Taskfile.yml'

        test -n "$target_ref" || {
          echo 'REF cannot be empty.' >&2
          exit 1
        }
        test -f "$private_taskfile" && test ! -L "$private_taskfile" || {
          echo "Expected a regular private Taskfile: $private_taskfile" >&2
          exit 1
        }
        test "$(grep -Ec '^  DOMOTIC_REF:' "$private_taskfile")" -eq 1 || {
          echo "Expected exactly one DOMOTIC_REF in $private_taskfile" >&2
          exit 1
        }

        if printf '%s\n' "$target_ref" | grep -Eq '^[0-9a-fA-F]{40}$'; then
          resolved_ref="$target_ref"
          if ! git -C "$source_dir" cat-file -e "$resolved_ref^{commit}" 2>/dev/null; then
            git -C "$source_dir" fetch --quiet --force --depth 1 origin "$target_ref"
          fi
        else
          git check-ref-format --allow-onelevel "$target_ref" >/dev/null 2>&1 || {
            echo "Invalid Git ref: $target_ref" >&2
            exit 1
          }
          git -C "$source_dir" fetch --quiet --force --depth 1 origin "$target_ref"
          resolved_ref="$(git -C "$source_dir" rev-parse 'FETCH_HEAD^{commit}')"
        fi
        resolved_ref="$(git -C "$source_dir" rev-parse "$resolved_ref^{commit}")"

        sed -i.bak -E \
          "s/^  DOMOTIC_REF:.*/  DOMOTIC_REF: $resolved_ref/" \
          "$private_taskfile"
        rm "$private_taskfile.bak"
        grep -Fqx "  DOMOTIC_REF: $resolved_ref" "$private_taskfile"

        git -C "$source_dir" checkout --quiet --detach --force "$resolved_ref"
        git -C "$source_dir" reset --quiet --hard "$resolved_ref"
        git -C "$source_dir" clean -ffd

        printf 'Domotic is now pinned to %s (%s).\n' "$resolved_ref" "$target_ref"
        printf 'Review and commit the Taskfile.yml change before deploying.\n'

  k3s:context:
    desc: Import the k3s server into the default kubeconfig
    deps: [source:sync]
    requires:
      vars: [SSH_USER, SSH_HOST]
    cmds:
      - >-
        "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}/scripts/k3s-import-context.sh"
        --user "$DOMOTIC_SSH_USER"
        "$DOMOTIC_SSH_HOST"

  check:
    desc: Validate the pinned source and private configuration
    deps: [source:sync]
    cmds:
      - task --dir "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}" check
      - task: config:check

  plan:
    desc: Plan the private deployment against encrypted R2 state
    deps: [config:check]
    cmds:
      - >-
        "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}/scripts/with-opentofu-environment.sh"
        runtime "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}" "{{.RESOLVED_PRIVATE_ROOT}}" "{{.RESOLVED_CONFIG_DIR}}" --
        env
        DOMOTIC_CONFIG_DIR="{{.RESOLVED_CONFIG_DIR}}"
        task --dir "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}" infra:plan

  deploy:
    desc: Apply OpenTofu and deploy the pinned Helm chart
    deps: [config:check]
    cmds:
      - >-
        "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}/scripts/with-opentofu-environment.sh"
        runtime "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}" "{{.RESOLVED_PRIVATE_ROOT}}" "{{.RESOLVED_CONFIG_DIR}}" --
        env
        DOMOTIC_CONFIG_DIR="{{.RESOLVED_CONFIG_DIR}}"
        RELEASE_NAME="{{.RESOLVED_RELEASE_NAME}}"
        NAMESPACE="{{.RESOLVED_NAMESPACE}}"
        task --dir "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}" deploy

  homeassistant:deploy:
    desc: Deploy the Helm release without applying OpenTofu
    deps: [config:check]
    cmds:
      - >-
        env
        DOMOTIC_CONFIG_DIR="{{.RESOLVED_CONFIG_DIR}}"
        RELEASE_NAME="{{.RESOLVED_RELEASE_NAME}}"
        NAMESPACE="{{.RESOLVED_NAMESPACE}}"
        task --dir "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}" helm:deploy

  homeassistant:update:
    desc: Update Home Assistant to the version verified by the Domotic pin
    deps: [config:check]
    cmds:
      - |
        version="$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' \
          "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}/charts/domotic/charts/homeassistant/Chart.yaml")"
        test -n "$version"
        "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}/scripts/set-homeassistant-version.sh" \
          "{{.RESOLVED_CONFIG_DIR}}/values.yaml" "$version"
        printf 'Home Assistant is pinned to %s in config/values.yaml.\n' "$version"
      - task: homeassistant:deploy

  restore:
    desc: Prepare Home Assistant to import a native backup
    deps: [config:check]
    cmds:
      - >-
        "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}/scripts/with-opentofu-environment.sh"
        runtime "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}" "{{.RESOLVED_PRIVATE_ROOT}}" "{{.RESOLVED_CONFIG_DIR}}" --
        env
        DOMOTIC_CONFIG_DIR="{{.RESOLVED_CONFIG_DIR}}"
        RELEASE_NAME="{{.RESOLVED_RELEASE_NAME}}"
        NAMESPACE="{{.RESOLVED_NAMESPACE}}"
        task --dir "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}" restore

  restore:plan:
    desc: Plan the native-backup restore preparation
    deps: [config:check]
    cmds:
      - >-
        "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}/scripts/with-opentofu-environment.sh"
        runtime "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}" "{{.RESOLVED_PRIVATE_ROOT}}" "{{.RESOLVED_CONFIG_DIR}}" --
        env
        DOMOTIC_CONFIG_DIR="{{.RESOLVED_CONFIG_DIR}}"
        task --dir "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}" restore:plan

  restore:complete:
    desc: Record the restored owner credential and resume reconciliation
    deps: [config:check]
    cmds:
      - >-
        "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}/scripts/with-opentofu-environment.sh"
        runtime "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}" "{{.RESOLVED_PRIVATE_ROOT}}" "{{.RESOLVED_CONFIG_DIR}}" --
        env
        DOMOTIC_CONFIG_DIR="{{.RESOLVED_CONFIG_DIR}}"
        RELEASE_NAME="{{.RESOLVED_RELEASE_NAME}}"
        NAMESPACE="{{.RESOLVED_NAMESPACE}}"
        task --dir "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}" restore:complete

  credentials:show:
    desc: Reveal Home Assistant recovery credentials
    deps: [config:check]
    cmds:
      - >-
        "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}/scripts/with-opentofu-environment.sh"
        runtime "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}" "{{.RESOLVED_PRIVATE_ROOT}}" "{{.RESOLVED_CONFIG_DIR}}" --
        env
        DOMOTIC_CONFIG_DIR="{{.RESOLVED_CONFIG_DIR}}"
        task --dir "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}" credentials:show

  credentials:update:
    desc: Record a changed Home Assistant owner credential in encrypted state
    deps: [config:check]
    cmds:
      - >-
        "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}/scripts/with-opentofu-environment.sh"
        runtime "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}" "{{.RESOLVED_PRIVATE_ROOT}}" "{{.RESOLVED_CONFIG_DIR}}" --
        env
        DOMOTIC_CONFIG_DIR="{{.RESOLVED_CONFIG_DIR}}"
        task --dir "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}" credentials:update

  zigbee:import:
    desc: Import an existing Zigbee identity into encrypted state
    deps: [config:check]
    requires:
      vars: [SOURCE]
    cmds:
      - >-
        "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}/scripts/with-opentofu-environment.sh"
        runtime "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}" "{{.RESOLVED_PRIVATE_ROOT}}" "{{.RESOLVED_CONFIG_DIR}}" --
        env
        DOMOTIC_CONFIG_DIR="{{.RESOLVED_CONFIG_DIR}}"
        SOURCE="{{.SOURCE}}"
        task --dir "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}" zigbee:import

  status:
    desc: Show the deployed release and workload status
    deps: [source:sync]
    cmds:
      - >-
        env
        RELEASE_NAME="{{.RESOLVED_RELEASE_NAME}}"
        NAMESPACE="{{.RESOLVED_NAMESPACE}}"
        task --dir "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}" helm:status

  destroy:
    desc: Remove workloads and ordinary infrastructure, preserving R2 buckets
    deps: [config:check]
    prompt: This removes the deployment but preserves R2 state and backups. Continue?
    cmds:
      - >-
        "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}/scripts/with-opentofu-environment.sh"
        runtime "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}" "{{.RESOLVED_PRIVATE_ROOT}}" "{{.RESOLVED_CONFIG_DIR}}" --
        env
        DOMOTIC_CONFIG_DIR="{{.RESOLVED_CONFIG_DIR}}"
        RELEASE_NAME="{{.RESOLVED_RELEASE_NAME}}"
        NAMESPACE="{{.RESOLVED_NAMESPACE}}"
        task --dir "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}" destroy

  version:
    desc: Show the requested and materialized Domotic revisions
    deps: [source:sync]
    cmds:
      - echo "Requested revision {{.DOMOTIC_REQUESTED_REF}}"
      - git -C "{{.RESOLVED_DOMOTIC_SOURCE_DIR}}" log -1 --oneline
