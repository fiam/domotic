version: '3'

includes:
  infra:
    taskfile: ./infra
    dir: ./infra
  helm:
    taskfile: ./charts/domotic
    dir: ./charts/domotic
  dev:
    taskfile: ./dev
    dir: ./dev

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  check:
    desc: Validate Terraform and Helm configuration
    cmds:
      - task: infra:check
      - task: helm:check

  custom integration:test:
    desc: Run the pinned custom integration submodule's protocol and emulator contracts
    preconditions:
      - sh: command -v docker >/dev/null
        msg: Install Docker before running the custom integration contract tests.
    cmds:
      - |
        integration_root="{{.ROOT_DIR}}/charts/domotic/charts/homeassistant/files/repositories/custom-integration"
        test -f "$integration_root/custom_components/custom integration/manifest.json"
        ha_version="$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' charts/domotic/charts/homeassistant/Chart.yaml)"
        docker run --rm \
          -v "$integration_root:/work:ro" \
          -w /work \
          -e PYTHONPATH=/work \
          "homeassistant/home-assistant:${ha_version}" \
          python -m unittest discover -s tests/custom integration -v

  deploy:
    desc: Apply infrastructure and deploy the chart
    cmds:
      - task: infra:apply
      - task: helm:deploy

  backup:
    desc: Encrypt configuration and state, then upload them to Cloudflare R2
    cmds:
      - task: infra:backup

  backup:list:
    desc: List encrypted backups in Cloudflare R2
    cmds:
      - task: infra:backup-list

  backup:restore:
    desc: Download and decrypt a backup into the ignored restore directory
    requires:
      vars: [OBJECT]
    cmds:
      - task: infra:backup-restore
        vars:
          OBJECT: '{{.OBJECT}}'

  keys:capture:
    desc: Capture the live Zigbee identity into the ignored Terraform file
    cmds:
      - task: infra:keys:capture

  keys:import:
    desc: Import a Zigbee identity from a portable file or restored backup
    requires:
      vars: [SOURCE]
    cmds:
      - task: infra:keys:import
        vars:
          SOURCE: '{{.SOURCE}}'

  destroy:
    desc: Uninstall the chart and destroy the infrastructure
    cmds:
      - task: helm:uninstall
      - task: infra:destroy

  deploy-dev:
    desc: Create Kind and deploy the complete development stack
    cmds:
      - task: dev:create
      - task: infra:apply
        vars:
          KUBE_CONTEXT: kind-domotic
      - task: helm:deploy
        vars:
          KUBE_CONTEXT: kind-domotic
          VALUES_FILE: '{{.ROOT_DIR}}/examples/values-kind.yaml'

  destroy-dev:
    desc: Remove the development deployment, infrastructure, and Kind cluster
    cmds:
      - task: helm:uninstall
        vars:
          KUBE_CONTEXT: kind-domotic
      - task: infra:destroy
        vars:
          KUBE_CONTEXT: kind-domotic
      - task: dev:destroy
