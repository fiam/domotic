apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: zstackmulator

resources:
  - k8s/namespace.yaml
  - k8s/deployment.yaml
  - k8s/service.yaml

configMapGenerator:
  - name: zstackmulator
    files:
      - zstackmulator.py

generatorOptions:
  disableNameSuffixHash: false
