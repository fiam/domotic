apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "mosquitto.fullname" . }}-test-connection"
  labels:
    {{- include "mosquitto.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: mqtt-check
      image: busybox
      command:
        - sh
        - -c
        - |
          nc -zv {{ include "mosquitto.fullname" . }} {{ .Values.service.mqttPort }}
  restartPolicy: Never
