# kube4ha - Home Automation Umbrella Chart
# This chart deploys Home Assistant, Zigbee2MQTT, Mosquitto MQTT broker, and Cloudflared tunnel
#
# Prerequisites:
# - Gateway API CRDs installed in the cluster
# - Gateway API controller (e.g., nginx-gateway-fabric)
# - Gateway resource in the default namespace (or configure parentRefs in subchart values)

# ==============================================================================
# Subchart Configuration
# ==============================================================================
# Override values for subcharts
# Each subchart has its own values.yaml with full configuration options

homeassistant: {}

mosquitto: {}

# Set enabled: false to skip Zigbee2MQTT entirely on deployments without a
# Zigbee radio (with OpenTofu, zigbee_enabled = false sets this and disables
# the Zigbee identity resources and the snapshot CronJob together).
zigbee2mqtt:
  enabled: true

cloudflared: {}
