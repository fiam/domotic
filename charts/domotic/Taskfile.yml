version: '3'

vars:
  CONFIG_DIR: '{{.CONFIG_DIR | default (printf "%s/../.." .ROOT_DIR)}}'
  RESOLVED_CONFIG_DIR: '{{if isAbs (toString .CONFIG_DIR)}}{{.CONFIG_DIR}}{{else}}{{joinPath .USER_WORKING_DIR (toString .CONFIG_DIR)}}{{end}}'
  RELEASE_NAME: '{{.RELEASE_NAME | default "domotic"}}'
  NAMESPACE: '{{.NAMESPACE | default "domotic"}}'
  HELM_KUBE_CONTEXT: '{{.KUBE_CONTEXT | default ""}}'
  TERRAFORM_VALUES_FILE: '{{.TERRAFORM_VALUES_FILE | default (printf "%s/infra/helm-values.yaml" .RESOLVED_CONFIG_DIR)}}'
  VALUES_FILE: '{{.VALUES_FILE | default (printf "%s/values.yaml" .RESOLVED_CONFIG_DIR)}}'
  HELM_TIMEOUT: '{{.HELM_TIMEOUT | default "10m"}}'

tasks:
  default:
    desc: List Helm tasks
    cmds:
      - task --list

  deploy:
    desc: Install or upgrade the Domotic release
    preconditions:
      - sh: command -v helm >/dev/null
        msg: Install Helm before running chart tasks.
      - sh: test -f "{{.TERRAFORM_VALUES_FILE}}"
        msg: Run `task infra:apply` to generate infra/helm-values.yaml first.
      - sh: test -f "{{.VALUES_FILE}}"
        msg: Copy an example to values.yaml and customize it first.
    cmds:
      - >-
        helm upgrade --install "{{.RELEASE_NAME}}" .
        --namespace "{{.NAMESPACE}}"
        --create-namespace
        {{if .HELM_KUBE_CONTEXT}}--kube-context "{{.HELM_KUBE_CONTEXT}}"{{end}}
        --values "{{.TERRAFORM_VALUES_FILE}}"
        --values "{{.VALUES_FILE}}"
        --rollback-on-failure
        --wait
        --timeout "{{.HELM_TIMEOUT}}"

  uninstall:
    desc: Uninstall the Domotic release
    cmds:
      - >-
        helm uninstall "{{.RELEASE_NAME}}"
        --namespace "{{.NAMESPACE}}"
        {{if .HELM_KUBE_CONTEXT}}--kube-context "{{.HELM_KUBE_CONTEXT}}"{{end}}
        --ignore-not-found

  status:
    desc: Show the Helm release and workload status
    cmds:
      - >-
        helm status "{{.RELEASE_NAME}}" --namespace "{{.NAMESPACE}}"
        {{if .HELM_KUBE_CONTEXT}}--kube-context "{{.HELM_KUBE_CONTEXT}}"{{end}}
      - >-
        kubectl
        {{if .HELM_KUBE_CONTEXT}}--context "{{.HELM_KUBE_CONTEXT}}"{{end}}
        --namespace "{{.NAMESPACE}}" get pods,cronjobs,jobs,httproutes

  template:
    desc: Render the chart locally with minimal example values
    cmds:
      - helm template "{{.RELEASE_NAME}}" . --namespace "{{.NAMESPACE}}" --values ../../examples/values-minimal.yaml

  lint:
    desc: Lint the Helm chart
    cmds:
      - helm lint .

  check:
    desc: Lint and test the Helm chart renderings
    cmds:
      - task: lint
      - |
        helm template "{{.RELEASE_NAME}}" . \
          --namespace "{{.NAMESPACE}}" \
          --kube-version 1.23.0 \
          --values ../../examples/values-minimal.yaml >/dev/null
        if helm template "{{.RELEASE_NAME}}" . \
          --namespace "{{.NAMESPACE}}" \
          --kube-version 1.22.17 \
          --values ../../examples/values-minimal.yaml >/dev/null 2>&1; then
          echo 'Kubernetes releases older than 1.23 must fail chart validation' >&2
          exit 1
        fi
      - |
        ha_version="$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' charts/homeassistant/Chart.yaml)"
        cloudflared_version="$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' charts/cloudflared/Chart.yaml)"
        zigbee2mqtt_version="$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' charts/zigbee2mqtt/Chart.yaml)"
        parent_version="$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' Chart.yaml)"
        test -n "$ha_version"
        test -n "$cloudflared_version"
        test -n "$zigbee2mqtt_version"
        test "$parent_version" = "$ha_version"
        for values_file in \
          ../../examples/values-minimal.yaml \
          ../../examples/values-kind.yaml \
          ../../examples/values-production.yaml
        do
          rendered="$(helm template "{{.RELEASE_NAME}}" . \
            --namespace "{{.NAMESPACE}}" \
            --values "$values_file")"
          printf '%s\n' "$rendered" |
            grep -F "image: \"homeassistant/home-assistant:${ha_version}\"" >/dev/null
          printf '%s\n' "$rendered" |
            grep -F "image: \"cloudflare/cloudflared:${cloudflared_version}\"" >/dev/null
          printf '%s\n' "$rendered" |
            grep -F "image: \"koenkk/zigbee2mqtt:${zigbee2mqtt_version}\"" >/dev/null
          if printf '%s\n' "$rendered" |
            grep -E 'image: [^[:space:]]+:latest(["[:space:]]|$)' >/dev/null; then
            echo "$values_file renders a mutable latest image" >&2
            exit 1
          fi
          if printf '%s\n' "$rendered" | grep -q 'mountPath: /config/custom_components/'; then
            echo "$values_file must not select a custom integration" >&2
            exit 1
          fi
        done
      - |
        remote_render="$(helm template "{{.RELEASE_NAME}}" . \
          --namespace "{{.NAMESPACE}}" \
          --values ../../examples/values-minimal.yaml \
          --set 'homeassistant.customComponents.remote[0].name=example_integration' \
          --set 'homeassistant.customComponents.remote[0].url=https://example.invalid/fixture.tar.gz' \
          --set 'homeassistant.customComponents.remote[0].sha256=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' \
          --set 'homeassistant.customComponents.remote[0].archivePath=fixture/custom_components/example_integration')"
        printf '%s\n' "$remote_render" | grep -q 'name: custom-example-integration'
        printf '%s\n' "$remote_render" | grep -Fq 'target="/config/custom_components/$COMPONENT_NAME"'
        printf '%s\n' "$remote_render" | grep -q 'name: custom-components-reconcile'
        printf '%s\n' "$remote_render" | grep -q 'managed-custom-components'
        if printf '%s\n' "$remote_render" | grep -q 'mountPath: /config/custom_components/'; then
          echo 'custom integrations must not create read-only mounts below /config' >&2
          exit 1
        fi
        printf '%s\n' "$remote_render" | grep -q 'sha256sum -c -'
        printf '%s\n' "$remote_render" | grep -q 'Custom component archive contains an unsafe path'
        if helm template "{{.RELEASE_NAME}}" . \
          --namespace "{{.NAMESPACE}}" \
          --values ../../examples/values-minimal.yaml \
          --set 'homeassistant.customComponents.remote[0].name=fixture' \
          --set 'homeassistant.customComponents.remote[0].url=http://example.invalid/fixture.tar.gz' \
          --set 'homeassistant.customComponents.remote[0].sha256=invalid' \
          --set 'homeassistant.customComponents.remote[0].archivePath=../fixture' \
          >/dev/null 2>&1; then
          echo 'unsafe remote custom component values must fail rendering' >&2
          exit 1
        fi
      - |
        backup_render="$(helm template "{{.RELEASE_NAME}}" . \
          --namespace "{{.NAMESPACE}}" \
          --values ../../examples/values-minimal.yaml \
          --set homeassistant.zigbee2mqttBackup.enabled=true \
          --set homeassistant.zigbee2mqttBackup.mqtt.server=domotic-mosquitto)"
        printf '%s\n' "$backup_render" | grep -Fq 'kind: CronJob'
        printf '%s\n' "$backup_render" | grep -Fq 'concurrencyPolicy: Forbid'
        printf '%s\n' "$backup_render" | grep -Fq 'requiredDuringSchedulingIgnoredDuringExecution:'
        printf '%s\n' "$backup_render" | grep -Fq 'topologyKey: kubernetes.io/hostname'
        printf '%s\n' "$backup_render" | grep -Fq 'app.kubernetes.io/component: server'
        printf '%s\n' "$backup_render" | grep -Fq 'claimName: domotic-homeassistant-pvc'
        printf '%s\n' "$backup_render" | grep -Fq 'mosquitto_rr "$@"'
        printf '%s\n' "$backup_render" | grep -Fq 'unzip -t "$archive_file"'
        printf '%s\n' "$backup_render" | grep -Fq 'value: "domotic-mosquitto"'
        if helm template "{{.RELEASE_NAME}}" . \
          --namespace "{{.NAMESPACE}}" \
          --values ../../examples/values-minimal.yaml \
          --set homeassistant.zigbee2mqttBackup.enabled=true \
          --set homeassistant.zigbee2mqttBackup.mqtt.server=domotic-mosquitto \
          --set homeassistant.zigbee2mqttBackup.directory=../outside \
          >/dev/null 2>&1; then
          echo 'unsafe Zigbee2MQTT backup directories must fail rendering' >&2
          exit 1
        fi
      - |
        seed_render="$(helm template "{{.RELEASE_NAME}}" . \
          --namespace "{{.NAMESPACE}}" \
          --values ../../examples/values-minimal.yaml \
          --set homeassistant.onboarding.enabled=true \
          --set homeassistant.onboarding.existingSecret.name=homeassistant-onboarding \
          --set homeassistant.r2Backup.enabled=true \
          --set homeassistant.r2Backup.bucket=domotic-test-backups \
          --set homeassistant.r2Backup.endpointUrl=https://example.invalid \
          --set homeassistant.r2Backup.existingSecret.name=homeassistant-r2-credentials \
          --set homeassistant.r2Backup.automatic.enabled=true \
          --set homeassistant.r2Backup.automatic.agentName=domotic-test-backups \
          --set homeassistant.r2Backup.automatic.existingSecret.name=homeassistant-backup-encryption)"
        printf '%s\n' "$seed_render" | grep -q 'name: domotic-homeassistant-onboarding'
        printf '%s\n' "$seed_render" | grep -q 'Home Assistant onboarding is complete'
        printf '%s\n' "$seed_render" | grep -q 'config/core/update'
        printf '%s\n' "$seed_render" | grep -q '/api/config/config_entries/flow'
        printf '%s\n' "$seed_render" | grep -q '"http/config/configure"'
        printf '%s\n' "$seed_render" | grep -q '"http/config/promote"'
        printf '%s\n' "$seed_render" | grep -q 'Created {handler} through its config flow'
        printf '%s\n' "$seed_render" | grep -q 'name: HOMEASSISTANT_EXTERNAL_URL'
        printf '%s\n' "$seed_render" | grep -q 'name: HOMEASSISTANT_INTERNAL_URL'
        printf '%s\n' "$seed_render" | grep -q 'name: R2_ACCESS_KEY_ID'
        printf '%s\n' "$seed_render" | grep -q 'backup/config/update'
        printf '%s\n' "$seed_render" | grep -q 'name: homeassistant-backup-encryption'
        if printf '%s\n' "$seed_render" | grep -q -E '\.storage-http|\.storage-core\.config_entries'; then
          echo 'private Home Assistant storage seeds must not be rendered' >&2
          exit 1
        fi
        if printf '%s\n' "$seed_render" | grep -q 'mountPath: /config/configuration.yaml'; then
          echo 'configuration.yaml must live on the PVC, not a permanent subPath mount' >&2
          exit 1
        fi
        configuration_render="$(helm template "{{.RELEASE_NAME}}" . \
          --namespace "{{.NAMESPACE}}" \
          --values ../../examples/values-minimal.yaml \
          --show-only charts/homeassistant/templates/configmap.yaml)"
        if printf '%s\n' "$configuration_render" | grep -q '^    homeassistant:'; then
          echo 'UI-managed Home Assistant core settings must not be rendered in configuration.yaml' >&2
          exit 1
        fi
        onboarding_script="$(printf '%s\n' "$seed_render" | awk '
          /^            - python3$/ { python = 1 }
          python && /^            - \|$/ { script = 1; next }
          script && /^          env:/ { exit }
          script { sub(/^              /, ""); print }
        ')"
        printf '%s\n' "$onboarding_script" | python3 -c 'import ast, sys; ast.parse(sys.stdin.read())'
        unencrypted_render="$(helm template "{{.RELEASE_NAME}}" . \
          --namespace "{{.NAMESPACE}}" \
          --values ../../examples/values-minimal.yaml \
          --set homeassistant.onboarding.enabled=true \
          --set homeassistant.onboarding.existingSecret.name=homeassistant-onboarding \
          --set homeassistant.r2Backup.enabled=true \
          --set homeassistant.r2Backup.bucket=domotic-test-backups \
          --set homeassistant.r2Backup.endpointUrl=https://example.invalid \
          --set homeassistant.r2Backup.existingSecret.name=homeassistant-r2-credentials \
          --set homeassistant.r2Backup.automatic.enabled=true \
          --set homeassistant.r2Backup.automatic.agentName=domotic-test-backups)"
        if printf '%s\n' "$unencrypted_render" | grep -q 'name: AUTOMATIC_BACKUP_PASSWORD'; then
          echo 'unencrypted backups must not reference a password Secret' >&2
          exit 1
        fi
        printf '%s\n' "$unencrypted_render" | grep -q '"protected": automatic_backup_password is not None'
        printf '%s\n' "$unencrypted_render" | grep -q '"password": automatic_backup_password'
      - |
        restore_render="$(helm template "{{.RELEASE_NAME}}" . \
          --namespace "{{.NAMESPACE}}" \
          --values ../../examples/values-minimal.yaml \
          --set homeassistant.configSeed.mode=restore \
          --set homeassistant.onboarding.enabled=true \
          --set homeassistant.onboarding.existingSecret.name=homeassistant-onboarding \
          --set homeassistant.r2Backup.enabled=true \
          --set homeassistant.r2Backup.automatic.enabled=true \
          --set homeassistant.r2Backup.automatic.agentName=domotic-test-backups \
          --set homeassistant.r2Backup.automatic.existingSecret.name=homeassistant-backup-encryption)"
        printf '%s\n' "$restore_render" | grep -q 'Creating minimal configuration for native restore'
        if printf '%s\n' "$restore_render" | grep -q 'name: domotic-homeassistant-onboarding'; then
          echo 'restore mode must not render the onboarding hook' >&2
          exit 1
        fi
        if printf '%s\n' "$restore_render" | grep -q '/api/config/config_entries/flow'; then
          echo 'restore mode must not render integration seeding' >&2
          exit 1
        fi
