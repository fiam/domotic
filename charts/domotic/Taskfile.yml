version: '3'

vars:
  RELEASE_NAME: '{{.RELEASE_NAME | default "domotic"}}'
  NAMESPACE: '{{.NAMESPACE | default "domotic"}}'
  HELM_KUBE_CONTEXT: '{{.KUBE_CONTEXT | default "domotic"}}'
  TERRAFORM_VALUES_FILE: '{{.TERRAFORM_VALUES_FILE | default "../../infra/helm-values.yaml"}}'
  VALUES_FILE: '{{.VALUES_FILE | default "../../values.yaml"}}'
  HELM_TIMEOUT: '{{.HELM_TIMEOUT | default "10m"}}'

tasks:
  default:
    desc: List Helm tasks
    cmds:
      - task --list

  deploy:
    desc: Install or upgrade the Domotic release
    preconditions:
      - sh: command -v helm >/dev/null
        msg: Install Helm before running chart tasks.
      - sh: test -f "{{.TERRAFORM_VALUES_FILE}}"
        msg: Run `task infra:apply` to generate infra/helm-values.yaml first.
      - sh: test -f "{{.VALUES_FILE}}"
        msg: Copy an example to values.yaml and customize it first.
    cmds:
      - >-
        helm upgrade --install "{{.RELEASE_NAME}}" .
        --namespace "{{.NAMESPACE}}"
        --create-namespace
        --kube-context "{{.HELM_KUBE_CONTEXT}}"
        --values "{{.TERRAFORM_VALUES_FILE}}"
        --values "{{.VALUES_FILE}}"
        --rollback-on-failure
        --wait
        --timeout "{{.HELM_TIMEOUT}}"

  uninstall:
    desc: Uninstall the Domotic release
    cmds:
      - >-
        helm uninstall "{{.RELEASE_NAME}}"
        --namespace "{{.NAMESPACE}}"
        --kube-context "{{.HELM_KUBE_CONTEXT}}"
        --ignore-not-found

  status:
    desc: Show the Helm release and workload status
    cmds:
      - helm status "{{.RELEASE_NAME}}" --namespace "{{.NAMESPACE}}" --kube-context "{{.HELM_KUBE_CONTEXT}}"
      - kubectl --context "{{.HELM_KUBE_CONTEXT}}" --namespace "{{.NAMESPACE}}" get pods,httproutes

  template:
    desc: Render the chart locally with minimal example values
    cmds:
      - helm template "{{.RELEASE_NAME}}" . --namespace "{{.NAMESPACE}}" --values ../../examples/values-minimal.yaml

  lint:
    desc: Lint the Helm chart
    cmds:
      - helm lint .

  check:
    desc: Lint and test the Helm chart renderings
    cmds:
      - task: lint
      - |
        ha_version="$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' charts/homeassistant/Chart.yaml)"
        parent_version="$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' Chart.yaml)"
        test -n "$ha_version"
        test "$parent_version" = "$ha_version"
        for values_file in \
          ../../examples/values-minimal.yaml \
          ../../examples/values-kind.yaml \
          ../../examples/values-production.yaml
        do
          rendered="$(helm template "{{.RELEASE_NAME}}" . \
            --namespace "{{.NAMESPACE}}" \
            --values "$values_file")"
          printf '%s\n' "$rendered" |
            grep -Fq "image: \"homeassistant/home-assistant:${ha_version}\""
        done
      - |
        seed_render="$(helm template "{{.RELEASE_NAME}}" . \
          --namespace "{{.NAMESPACE}}" \
          --values ../../examples/values-minimal.yaml \
          --set homeassistant.onboarding.enabled=true \
          --set homeassistant.onboarding.existingSecret.name=homeassistant-onboarding \
          --set homeassistant.r2Backup.enabled=true \
          --set homeassistant.r2Backup.bucket=domotic-test-backups \
          --set homeassistant.r2Backup.endpointUrl=https://example.invalid \
          --set homeassistant.r2Backup.existingSecret.name=homeassistant-r2-credentials \
          --set homeassistant.r2Backup.automatic.enabled=true \
          --set homeassistant.r2Backup.automatic.agentName=domotic-test-backups \
          --set homeassistant.r2Backup.automatic.existingSecret.name=homeassistant-backup-encryption)"
        printf '%s\n' "$seed_render" | grep -q 'name: domotic-homeassistant-onboarding'
        printf '%s\n' "$seed_render" | grep -q 'Home Assistant onboarding is complete'
        printf '%s\n' "$seed_render" | grep -q 'config/core/update'
        printf '%s\n' "$seed_render" | grep -q 'name: HOMEASSISTANT_EXTERNAL_URL'
        printf '%s\n' "$seed_render" | grep -q 'name: HOMEASSISTANT_INTERNAL_URL'
        printf '%s\n' "$seed_render" | grep -q 'backup/config/update'
        printf '%s\n' "$seed_render" | grep -q 'name: homeassistant-backup-encryption'
        if printf '%s\n' "$seed_render" | grep -q 'mountPath: /config/configuration.yaml'; then
          echo 'configuration.yaml must live on the PVC, not a permanent subPath mount' >&2
          exit 1
        fi
        configuration_render="$(helm template "{{.RELEASE_NAME}}" . \
          --namespace "{{.NAMESPACE}}" \
          --values ../../examples/values-minimal.yaml \
          --show-only charts/homeassistant/templates/configmap.yaml)"
        if printf '%s\n' "$configuration_render" | grep -q '^    homeassistant:'; then
          echo 'UI-managed Home Assistant core settings must not be rendered in configuration.yaml' >&2
          exit 1
        fi
      - |
        restore_render="$(helm template "{{.RELEASE_NAME}}" . \
          --namespace "{{.NAMESPACE}}" \
          --values ../../examples/values-minimal.yaml \
          --set homeassistant.configSeed.mode=restore \
          --set homeassistant.onboarding.enabled=true \
          --set homeassistant.onboarding.existingSecret.name=homeassistant-onboarding \
          --set homeassistant.r2Backup.enabled=true \
          --set homeassistant.r2Backup.automatic.enabled=true \
          --set homeassistant.r2Backup.automatic.agentName=domotic-test-backups \
          --set homeassistant.r2Backup.automatic.existingSecret.name=homeassistant-backup-encryption)"
        printf '%s\n' "$restore_render" | grep -q 'Creating minimal configuration for native restore'
        if printf '%s\n' "$restore_render" | grep -q 'name: domotic-homeassistant-onboarding'; then
          echo 'restore mode must not render the onboarding hook' >&2
          exit 1
        fi
        if printf '%s\n' "$restore_render" | grep -q 'Initializing Home Assistant config entries'; then
          echo 'restore mode must not render integration seeding' >&2
          exit 1
        fi
