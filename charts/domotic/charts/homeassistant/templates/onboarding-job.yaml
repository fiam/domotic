{{/*
Private, version-coupled Home Assistant HTTP flows. Read
HOME_ASSISTANT_COMPATIBILITY.md before changing the HA image or this Job.
*/}}
{{- if and .Values.onboarding.enabled (eq .Values.configSeed.mode "seed") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "homeassistant.fullname" . }}-onboarding
  labels:
    {{- include "homeassistant.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "10"
spec:
  activeDeadlineSeconds: {{ .Values.onboarding.activeDeadlineSeconds }}
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "homeassistant.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: onboarding
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: onboarding
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python3
            - -c
          args:
            - |
              import json
              import os
              import sys
              import time
              import asyncio
              import urllib.error
              import urllib.parse
              import urllib.request

              base_url = os.environ["HOMEASSISTANT_URL"].rstrip("/")
              client_id = os.environ["HOMEASSISTANT_CLIENT_ID"]
              automatic_backups_enabled = (
                  os.environ.get("AUTOMATIC_BACKUP_ENABLED") == "true"
              )

              class CredentialsRejected(Exception):
                  pass

              def request(path, method="GET", payload=None, form=None, token=None):
                  data = None
                  headers = {}
                  if payload is not None:
                      data = json.dumps(payload).encode()
                      headers["Content-Type"] = "application/json"
                  elif form is not None:
                      data = urllib.parse.urlencode(form).encode()
                      headers["Content-Type"] = "application/x-www-form-urlencoded"
                  if token is not None:
                      headers["Authorization"] = f"Bearer {token}"
                  req = urllib.request.Request(
                      f"{base_url}{path}", data=data, headers=headers, method=method
                  )
                  with urllib.request.urlopen(req, timeout=10) as response:
                      content = response.read()
                  return json.loads(content) if content else None

              def is_done(status, step):
                  return next(item for item in status if item["step"] == step)["done"]

              def login_auth_code():
                  flow = request(
                      "/auth/login_flow",
                      method="POST",
                      payload={
                          "client_id": client_id,
                          "handler": ["homeassistant", None],
                          "redirect_uri": client_id,
                      },
                  )
                  result = request(
                      f"/auth/login_flow/{flow['flow_id']}",
                      method="POST",
                      payload={
                          "client_id": client_id,
                          "username": os.environ["ADMIN_USERNAME"],
                          "password": os.environ["ADMIN_PASSWORD"],
                      },
                  )
                  if result.get("type") != "create_entry":
                      raise CredentialsRejected
                  return result["result"]

              def complete_step(status, step, path, token, payload=None):
                  if is_done(status, step):
                      return status
                  try:
                      request(path, method="POST", payload=payload, token=token)
                  except urllib.error.HTTPError as err:
                      # A concurrent browser or a retry may have completed it.
                      current = request("/api/onboarding")
                      if not is_done(current, step):
                          raise err
                      return current
                  return request("/api/onboarding")

              async def configure_automatic_backups(token):
                  # aiohttp is part of the pinned Home Assistant image. The
                  # backup WebSocket commands are private and version-coupled;
                  # keep HOME_ASSISTANT_COMPATIBILITY.md in sync with them.
                  import aiohttp

                  parsed_url = urllib.parse.urlsplit(base_url)
                  websocket_url = urllib.parse.urlunsplit(
                      (
                          "wss" if parsed_url.scheme == "https" else "ws",
                          parsed_url.netloc,
                          "/api/websocket",
                          "",
                          "",
                      )
                  )
                  timeout = aiohttp.ClientTimeout(total=15)
                  async with aiohttp.ClientSession(timeout=timeout) as session:
                      async with session.ws_connect(websocket_url) as websocket:
                          auth_required = await websocket.receive_json()
                          if auth_required.get("type") != "auth_required":
                              raise RuntimeError(
                                  "Home Assistant WebSocket did not request authentication"
                              )
                          await websocket.send_json(
                              {"type": "auth", "access_token": token}
                          )
                          auth_result = await websocket.receive_json()
                          if auth_result.get("type") != "auth_ok":
                              raise RuntimeError(
                                  "Home Assistant rejected backup configuration authentication"
                              )

                          next_message_id = 1

                          async def command(command_type, **payload):
                              nonlocal next_message_id
                              message_id = next_message_id
                              next_message_id += 1
                              await websocket.send_json(
                                  {
                                      "id": message_id,
                                      "type": command_type,
                                      **payload,
                                  }
                              )
                              while True:
                                  response = await websocket.receive_json()
                                  if response.get("id") != message_id:
                                      continue
                                  if not response.get("success"):
                                      error = response.get("error", {})
                                      raise RuntimeError(
                                          f"{command_type} failed: "
                                          f"{error.get('code', 'unknown')}"
                                      )
                                  return response.get("result")

                          config_result = await command("backup/config/info")
                          if config_result["config"].get(
                              "automatic_backups_configured"
                          ):
                              print(
                                  "Home Assistant automatic backups are already "
                                  "configured; preserving them"
                              )
                              existing_password = config_result["config"].get(
                                  "create_backup", {}
                              ).get("password")
                              if existing_password != os.environ.get(
                                  "AUTOMATIC_BACKUP_PASSWORD"
                              ):
                                  print(
                                      "The preserved schedule uses its existing "
                                      "emergency key, not the seed Secret"
                                  )
                              return

                          backup_agent = None
                          for _ in range(60):
                              agents_result = await command("backup/agents/info")
                              matching_agents = [
                                  agent
                                  for agent in agents_result["agents"]
                                  if agent["name"] == os.environ["R2_BACKUP_AGENT_NAME"]
                                  and agent["agent_id"].startswith("cloudflare_r2.")
                              ]
                              if len(matching_agents) == 1:
                                  backup_agent = matching_agents[0]
                                  break
                              if len(matching_agents) > 1:
                                  raise RuntimeError(
                                      "Multiple Cloudflare R2 backup agents match the bucket"
                                  )
                              await asyncio.sleep(2)

                          if backup_agent is None:
                              raise RuntimeError(
                                  "Cloudflare R2 backup agent did not become available"
                              )

                          agent_id = backup_agent["agent_id"]
                          retention_copies = int(
                              os.environ["AUTOMATIC_BACKUP_RETENTION_COPIES"]
                          )
                          backup_time = (
                              os.environ.get("AUTOMATIC_BACKUP_TIME", "").strip()
                              or None
                          )
                          await command(
                              "backup/config/update",
                              agents={
                                  agent_id: {
                                      "protected": True,
                                      "retention": None,
                                  }
                              },
                              automatic_backups_configured=True,
                              create_backup={
                                  "agent_ids": [agent_id],
                                  "include_addons": [],
                                  "include_all_addons": False,
                                  "include_database": True,
                                  "include_folders": [],
                                  "name": None,
                                  "password": os.environ["AUTOMATIC_BACKUP_PASSWORD"],
                              },
                              retention={
                                  "copies": retention_copies,
                                  "days": None,
                              },
                              schedule={
                                  "days": [],
                                  "recurrence": "daily",
                                  "time": backup_time,
                              },
                          )
                          print(
                              "Configured daily encrypted Home Assistant backups "
                              "to Cloudflare R2"
                          )

              status = None
              onboarding_complete = False
              for _ in range(120):
                  try:
                      status = request("/api/onboarding")
                      break
                  except urllib.error.HTTPError as err:
                      if err.code == 404:
                          print("Home Assistant onboarding is already complete")
                          onboarding_complete = True
                          break
                      time.sleep(2)
                  except (OSError, urllib.error.URLError):
                      time.sleep(2)

              if status is None and not onboarding_complete:
                  sys.exit("Home Assistant did not become ready for onboarding")

              if status is not None and all(item["done"] for item in status):
                  print("Home Assistant onboarding is already complete; preserving it")
                  onboarding_complete = True

              if onboarding_complete and not automatic_backups_enabled:
                  raise SystemExit(0)

              auth_code = None
              if not onboarding_complete and not is_done(status, "user"):
                  try:
                      result = request(
                          "/api/onboarding/users",
                          method="POST",
                          payload={
                              "name": os.environ["ADMIN_NAME"],
                              "username": os.environ["ADMIN_USERNAME"],
                              "password": os.environ["ADMIN_PASSWORD"],
                              "language": os.environ["ADMIN_LANGUAGE"],
                              "client_id": client_id,
                          },
                      )
                      auth_code = result["auth_code"]
                      print("Created the first Home Assistant owner account")
                  except urllib.error.HTTPError as err:
                      # A concurrent browser may have completed the same
                      # one-shot step. Continue only when HA confirms it.
                      status = request("/api/onboarding")
                      if not is_done(status, "user"):
                          raise err

              if auth_code is None:
                  try:
                      auth_code = login_auth_code()
                  except CredentialsRejected:
                      # This is an existing, partially onboarded installation
                      # owned by someone else. Do not replace its credentials or
                      # block Helm upgrades; let that owner finish in the UI.
                      print(
                          "Existing owner credentials differ from the seed; "
                          "preserving the remaining onboarding steps"
                      )
                      raise SystemExit(0)

              tokens = request(
                  "/auth/token",
                  method="POST",
                  form={
                      "client_id": client_id,
                      "grant_type": "authorization_code",
                      "code": auth_code,
                  },
              )
              access_token = tokens["access_token"]
              refresh_token = tokens["refresh_token"]
              try:
                  if not onboarding_complete:
                      status = request("/api/onboarding")
                      status = complete_step(
                          status,
                          "core_config",
                          "/api/onboarding/core_config",
                          access_token,
                      )
                      status = complete_step(
                          status,
                          "analytics",
                          "/api/onboarding/analytics",
                          access_token,
                      )
                      status = complete_step(
                          status,
                          "integration",
                          "/api/onboarding/integration",
                          access_token,
                          {"client_id": client_id, "redirect_uri": client_id},
                      )
                      if not all(item["done"] for item in status):
                          sys.exit("Home Assistant onboarding did not complete")
                  if automatic_backups_enabled:
                      asyncio.run(configure_automatic_backups(access_token))
              finally:
                  request(
                      "/auth/revoke",
                      method="POST",
                      form={"token": refresh_token},
                  )

              print("Home Assistant onboarding is complete")
          env:
            - name: HOMEASSISTANT_URL
              value: {{ printf "http://%s:%v" (include "homeassistant.fullname" .) .Values.service.port | quote }}
            - name: HOMEASSISTANT_CLIENT_ID
              value: {{ printf "%s/" (trimSuffix "/" .Values.config.internal_url) | quote }}
            - name: ADMIN_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ required "onboarding.existingSecret.name is required when onboarding is enabled" .Values.onboarding.existingSecret.name }}
                  key: {{ .Values.onboarding.existingSecret.nameKey }}
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.onboarding.existingSecret.name }}
                  key: {{ .Values.onboarding.existingSecret.usernameKey }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.onboarding.existingSecret.name }}
                  key: {{ .Values.onboarding.existingSecret.passwordKey }}
            - name: ADMIN_LANGUAGE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.onboarding.existingSecret.name }}
                  key: {{ .Values.onboarding.existingSecret.languageKey }}
            - name: AUTOMATIC_BACKUP_ENABLED
              value: {{ (and .Values.r2Backup.enabled .Values.r2Backup.automatic.enabled) | quote }}
          {{- if and .Values.r2Backup.enabled .Values.r2Backup.automatic.enabled }}
            - name: R2_BACKUP_AGENT_NAME
              value: {{ required "r2Backup.automatic.agentName is required when automatic R2 backups are enabled" .Values.r2Backup.automatic.agentName | quote }}
            - name: AUTOMATIC_BACKUP_RETENTION_COPIES
              value: {{ .Values.r2Backup.automatic.retentionCopies | quote }}
            - name: AUTOMATIC_BACKUP_TIME
              value: {{ .Values.r2Backup.automatic.time | default "" | quote }}
            - name: AUTOMATIC_BACKUP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "r2Backup.automatic.existingSecret.name is required when automatic R2 backups are enabled" .Values.r2Backup.automatic.existingSecret.name }}
                  key: {{ .Values.r2Backup.automatic.existingSecret.passwordKey }}
          {{- end }}
          {{- with .Values.onboarding.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
