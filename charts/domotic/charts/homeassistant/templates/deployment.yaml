apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "homeassistant.fullname" . }}
  labels:
    {{- include "homeassistant.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "homeassistant.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        configmap.revision: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
      labels:
        {{- include "homeassistant.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "homeassistant.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- if .Values.configSeed.enabled }}
      initContainers:
        - name: config-seed
          image: "{{ .Values.configSeed.image.repository }}:{{ .Values.configSeed.image.tag }}"
          imagePullPolicy: {{ .Values.configSeed.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              files="automations.yaml scripts.yaml scenes.yaml .storage/core.config_entries"
              for rel in $files; do
                echo "Processing default file: ${rel}"
                file="/defaults/$(echo "$rel" | tr '/' '-')"
                target="/config/${rel}"
                seed="/config/.seed/${rel}"
                mkdir -p "$(dirname "$target")" "$(dirname "$seed")"
                if [ ! -f "$seed" ]; then
                  echo "No seed found for ${rel}, initializing"
                  cp "$file" "$target"
                  cp "$file" "$seed"
                elif ! cmp -s "$file" "$seed"; then
                  echo "Default updated for ${rel}, refreshing"
                  cp "$file" "$target"
                  cp "$file" "$seed"
                elif [ ! -f "$target" ]; then
                  echo "Missing ${rel}, restoring from defaults"
                  cp "$seed" "$target"
                fi
              done
          volumeMounts:
            - name: config
              mountPath: /config
            - name: configuration-files
              mountPath: /defaults
          {{- with .Values.configSeed.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - SYS_ADMIN
          image: "{{ .Values.image.repository | default "homeassistant/home-assistant" }}:{{ .Values.image.tag | default "stable" }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: configuration-files
              mountPath: /config/configuration.yaml
              subPath: configuration.yaml
              readOnly: true
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ include "homeassistant.fullname" . }}-pvc
        - name: configuration-files
          configMap:
            name: {{ include "homeassistant.fullname" . }}-configuration
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
