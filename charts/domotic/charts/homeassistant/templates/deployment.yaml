{{- if not (has .Values.configSeed.mode (list "seed" "restore")) }}
{{- fail "configSeed.mode must be seed or restore" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "homeassistant.fullname" . }}
  labels:
    {{- include "homeassistant.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "homeassistant.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        configmap.revision: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
      labels:
        {{- include "homeassistant.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "homeassistant.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- if .Values.configSeed.enabled }}
      initContainers:
        - name: config-seed
          image: "{{ .Values.configSeed.image.repository }}:{{ .Values.configSeed.image.tag }}"
          imagePullPolicy: {{ .Values.configSeed.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              {{- if eq .Values.configSeed.mode "seed" }}
              files="configuration.yaml automations.yaml scripts.yaml scenes.yaml"
              for rel in $files; do
                echo "Processing default file: ${rel}"
                file="/defaults/$(echo "$rel" | tr '/' '-')"
                target="/config/${rel}"
                seed="/config/.seed/${rel}"
                mkdir -p "$(dirname "$target")" "$(dirname "$seed")"
                if [ ! -f "$seed" ]; then
                  if [ ! -f "$target" ]; then
                    echo "Initializing ${rel}"
                    cp "$file" "$target"
                  else
                    echo "Adopting existing ${rel} without changing it"
                  fi
                  cp "$file" "$seed"
                elif ! cmp -s "$file" "$seed"; then
                  if [ ! -f "$target" ] || cmp -s "$target" "$seed"; then
                    echo "Chart default updated for ${rel}, refreshing unchanged file"
                    cp "$file" "$target"
                  else
                    echo "Preserving user-managed ${rel}"
                  fi
                  cp "$file" "$seed"
                elif [ ! -f "$target" ]; then
                  echo "Missing ${rel}, restoring from defaults"
                  cp "$seed" "$target"
                fi
              done

              # Home Assistant 2026.8 moved HTTP server and trusted-proxy
              # settings into UI-managed storage. Seed a confirmed stable
              # configuration only on a fresh volume so reverse proxies work
              # immediately without a five-minute trial and rollback.
              http_target="/config/.storage/http"
              if [ ! -f "$http_target" ]; then
                echo "Initializing Home Assistant HTTP settings"
                mkdir -p "$(dirname "$http_target")"
                cp /defaults/.storage-http "$http_target"
              else
                echo "Preserving existing Home Assistant HTTP settings"
              fi

              # Config entries are user-managed after Home Assistant starts.
              # Seed them only on a fresh volume; never overwrite integrations
              # that were subsequently added or changed through the UI.
              target="/config/.storage/core.config_entries"
              if [ ! -f "$target" ]; then
                echo "Initializing Home Assistant config entries"
                mkdir -p "$(dirname "$target")"
                cp /defaults/.storage-core.config_entries /tmp/core.config_entries
                {{- if .Values.r2Backup.enabled }}
                sed -i \
                  -e "s/__R2_ACCESS_KEY_ID__/${R2_ACCESS_KEY_ID}/g" \
                  -e "s/__R2_SECRET_ACCESS_KEY__/${R2_SECRET_ACCESS_KEY}/g" \
                  /tmp/core.config_entries
                {{- end }}
                cp /tmp/core.config_entries "$target"
              else
                echo "Preserving existing Home Assistant config entries"
              fi
              {{- else }}
              # A blank volume needs a minimal configuration to start the
              # frontend and expose Home Assistant's native restore flow. The
              # restored configuration replaces this file on the PVC; unlike a
              # subPath mount, it is not permanently shadowed by the chart.
              if [ ! -f /config/configuration.yaml ]; then
                echo "Creating minimal configuration for native restore"
                cp /defaults/restore-configuration.yaml /config/configuration.yaml
              else
                echo "Native-restore mode: preserving all Home Assistant configuration"
              fi
              {{- end }}
          {{- if and .Values.r2Backup.enabled (eq .Values.configSeed.mode "seed") }}
          env:
            - name: R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ required "r2Backup.existingSecret.name is required when R2 backup is enabled" .Values.r2Backup.existingSecret.name }}
                  key: {{ .Values.r2Backup.existingSecret.accessKeyIdKey }}
            - name: R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.r2Backup.existingSecret.name }}
                  key: {{ .Values.r2Backup.existingSecret.secretAccessKeyKey }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: configuration-files
              mountPath: /defaults
          {{- with .Values.configSeed.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - SYS_ADMIN
          image: "{{ .Values.image.repository | default "homeassistant/home-assistant" }}:{{ .Values.image.tag | default "stable" }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ include "homeassistant.fullname" . }}-pvc
        - name: configuration-files
          configMap:
            name: {{ include "homeassistant.fullname" . }}-configuration
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
