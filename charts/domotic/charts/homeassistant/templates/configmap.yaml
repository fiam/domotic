apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "homeassistant.fullname" . }}-configuration
  labels:
    {{- include "homeassistant.labels" . | nindent 4 }}
data:
  configuration.yaml: |
    default_config:
    frontend:
      themes: !include_dir_merge_named themes

    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml
  # Used only to boot a blank PVC far enough to present Home Assistant's
  # native backup restore flow. A restored configuration.yaml replaces it.
  restore-configuration.yaml: |
    default_config:
  automations.yaml: |
    []
  scripts.yaml: |
    {}
  scenes.yaml: |
    []
