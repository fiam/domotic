{{- $cfg := .Values.config -}}
{{- $r2 := .Values.r2Backup -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "homeassistant.fullname" . }}-configuration
  labels:
    {{- include "homeassistant.labels" . | nindent 4 }}
data:
  configuration.yaml: |
    default_config:
    frontend:
      themes: !include_dir_merge_named themes

    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml
  # Used only to boot a blank PVC far enough to present Home Assistant's
  # native backup restore flow. A restored configuration.yaml replaces it.
  restore-configuration.yaml: |
    default_config:
  automations.yaml: |
    []
  scripts.yaml: |
    {}
  scenes.yaml: |
    []
  # Private Home Assistant storage formats. Read
  # HOME_ASSISTANT_COMPATIBILITY.md before changing the HA image or this JSON.
  .storage-http: |
    {
      "version": 2,
      "minor_version": 2,
      "key": "http",
      "data": {
        "stable": {
          "server_port": 8123,
          "use_x_forwarded_for": {{ $cfg.http.useXForwardedFor }},
          "trusted_proxies": {{ $cfg.http.trustedProxies | toJson }},
          "login_attempts_threshold": -1,
          "cors_allowed_origins": ["https://cast.home-assistant.io"],
          "ssl_profile": "modern",
          "use_x_frame_options": true,
          "ip_ban_enabled": true,
          "created_at": "2026-08-23T00:00:00+00:00",
          "error": null,
          "error_message": null
        },
        "pending": null,
        "yaml_migration_done": true
      }
    }
  .storage-core.config_entries: |
    {
      "version": 1,
      "minor_version": 5,
      "key": "core.config_entries",
      "data": {
        "entries": [
          {{- if and $cfg.mqtt $cfg.mqtt.server $cfg.mqtt.port -}}
          {
            "created_at":"2025-11-06T09:14:44.904448+00:00",
            "data": {
              "broker":"{{ $cfg.mqtt.server }}",
              "port":{{ $cfg.mqtt.port }},
              "protocol":"5"
            },
            "disabled_by":null,
            "discovery_keys":{},
            "domain":"mqtt",
            "entry_id":"01K9C74TS8PAJK8YYPA98PWT24",
            "minor_version":1,
            "modified_at":"2025-11-06T09:14:44.904451+00:00",
            "options":{},
            "pref_disable_new_entities":false,
            "pref_disable_polling":false,
            "source":"user",
            "subentries":[],
            "title":"{{ $cfg.mqtt.server }}",
            "unique_id":null,
            "version":2
          }
          {{- if $r2.enabled -}},{{- end }}
          {{- end -}}
          {{- if $r2.enabled }}
          {
            "created_at":"2026-08-23T00:00:00+00:00",
            "data": {
              "access_key_id":"__R2_ACCESS_KEY_ID__",
              "secret_access_key":"__R2_SECRET_ACCESS_KEY__",
              "bucket":{{ $r2.bucket | toJson }},
              "endpoint_url":{{ $r2.endpointUrl | toJson }},
              "prefix":{{ $r2.prefix | toJson }}
            },
            "disabled_by":null,
            "discovery_keys":{},
            "domain":"cloudflare_r2",
            "entry_id":"01K3R2B4CK7P7M5N8Q2V9X6Z1A",
            "minor_version":1,
            "modified_at":"2026-08-23T00:00:00+00:00",
            "options":{},
            "pref_disable_new_entities":false,
            "pref_disable_polling":false,
            "source":"user",
            "subentries":[],
            "title":{{ $r2.bucket | toJson }},
            "unique_id":null,
            "version":1
          }
          {{- end }}
        ]
      }
    }
