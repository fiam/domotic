# Default values for homeassistant.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

configSeed:
  enabled: true
  # seed initializes chart defaults and integrations without overwriting
  # user-managed files; restore writes only the minimal configuration needed
  # on a blank volume to expose Home Assistant's native backup restoration.
  # Set enabled=false only when the PVC is already populated independently.
  mode: seed
  image:
    repository: busybox
    tag: "1.36.1"
    pullPolicy: IfNotPresent
  resources: {}

# Create the first owner account through Home Assistant's built-in but
# undocumented onboarding HTTP flow. The authenticated hook also creates
# missing MQTT and R2 entries through their config flows and reconciles HTTP
# proxy settings. Read HOME_ASSISTANT_COMPATIBILITY.md before changing the HA
# image. Terraform creates the referenced Secret when homeassistant_onboarding
# is configured. The hook preserves completed onboarding and never replaces an
# existing owner or password.
onboarding:
  enabled: false
  activeDeadlineSeconds: 600
  existingSecret:
    name: ""
    nameKey: name
    usernameKey: username
    passwordKey: password
    languageKey: language
  resources: {}

# Create Home Assistant's official Cloudflare R2 backup integration through its
# config flow when owner seeding is enabled and no matching entry exists.
# Terraform supplies this block and creates the referenced Secret when
# r2_backup_bucket_name is configured.
r2Backup:
  enabled: false
  bucket: ""
  endpointUrl: ""
  prefix: home-assistant
  existingSecret:
    name: ""
    accessKeyIdKey: access_key_id
    secretAccessKeyKey: secret_access_key
  # With Terraform, this defaults to daily encrypted backups retained for
  # seven copies when R2 and owner seeding are both enabled. The onboarding
  # hook initializes only an unconfigured backup schedule; later UI changes
  # remain owned by Home Assistant.
  automatic:
    enabled: false
    agentName: ""
    retentionCopies: 7
    # Empty uses Home Assistant's early-morning default plus randomized jitter.
    time: ""
    existingSecret:
      name: ""
      passwordKey: password

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: "homeassistant/home-assistant"
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  # Pin exact patches: see HOME_ASSISTANT_COMPATIBILITY.md before changing.
  tag: "2026.8.3"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: true
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - homeassistant.local
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

config:
  # Reconciled through Home Assistant's WebSocket API on every seed-mode Helm
  # install/upgrade. The UI remains editable, but a later deployment restores
  # these declared values.
  name: Home
  external_url: http://example.com
  internal_url: http://homeassistant.local
  http:
    useXForwardedFor: true
    trustedProxies:
      - 10.0.0.0/8
  mqtt:
    server: mosquitto.default.svc.cluster.local
    port: 1883
  volume:
    size: 10Gi

logger:
  default: info
