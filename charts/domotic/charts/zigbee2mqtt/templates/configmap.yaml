apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zigbee2mqtt.fullname" . }}-config
  labels:
    {{- include "zigbee2mqtt.labels" . | nindent 4 }}
data:
  configuration.yaml: |
    {{- $cfg := .Values.config }}
    serial:
        {{ $cfg.serial | toYaml | nindent 8 }}
    mqtt:
        server: mqtt://{{ $cfg.mqtt.server }}:{{ $cfg.mqtt.port }}
        {{ with $cfg.mqtt.client_id }}client_id: {{ . | toYaml }}{{ end }}
    frontend:
        enabled: true
        package: zigbee2mqtt-windfront
        port: 8080
        host: 0.0.0.0
        url: {{ $cfg.frontend.url }}
    homeassistant:
        enabled: true
    advanced:
        log_level: debug
